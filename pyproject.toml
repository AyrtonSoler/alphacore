[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphacore"
version = "0.1.0"
description = "Pure-compute quant strategy engine: signals, portfolio, ml, backtest."
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "cvxpy",
    "scikit-learn",
    "interpret",
    "QuantLib",
    "structlog",
    "pyarrow",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "pandas-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["src/alphacore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["interpret.*", "sklearn.*", "scipy.*", "matplotlib.*", "QuantLib.*"]
ignore_missing_imports = true

# cvxpy ships a py.typed marker but with incomplete inline annotations, so mypy
# resolves it and then emits false attr-defined / no-untyped-call errors for valid
# runtime API (cp.quad_form, cp.psd_wrap, ...). Skip following it so it is treated
# as untyped rather than partially-typed; strict stays on for our own code.
[[tool.mypy.overrides]]
module = ["cvxpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D", "PLR2004"]
